[project]
name = "urlab-bridge"
version = "0.1.0-alpha"
description = "ZMQ bridge, ROS 2 rebroadcaster, and policy runner for Unreal Robotics Lab"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Jonathan Embley-Riches", email = "jonathanembleyriches@outlook.com"}]
urls = {Homepage = "https://github.com/URLab-Sim/urlab_bridge", Documentation = "https://github.com/URLab-Sim/UnrealRoboticsLab"}
dependencies = [
    "pyzmq>=25.0.0",
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "dearpygui>=1.11.1",
]

[project.optional-dependencies]
policy = [
    # Core ML
    "torch>=2.0.0",
    "onnxruntime>=1.16.0",
    "scipy>=1.11.0",
    # MuJoCo
    "mujoco>=3.2.0",
    # RoboJuDo dependencies
    "pydantic>=2.0.0",
    "python-box>=7.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "easydict>=1.10",
    "msgpack>=1.0.0",
    "msgpack-numpy>=0.4.8",
    "colorlog>=6.7.0",
    "joblib>=1.3.0",
]

[project.scripts]
urlab-policy = "urlab_policy.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/urlab_policy"]
