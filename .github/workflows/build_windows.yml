name: hutb Windows CI/CD

on: 
  pull_request:
  workflow_dispatch:


jobs:
  windows-dev:
    name: Windows CI/CD
    timeout-minutes: 1440
    runs-on: self-hosted:windows
    env:
      UE4_ROOT: C:\workspace\UnrealEngine
      VCVARS: C:\Program Files (x86)\Microsoft Visual Studio\2019\Community\VC\Auxiliary\Build\vcvars64.bat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup
        run: |
          call setEnv64.bat
          call setup.bat
          git update-index --skip-worktree Unreal/CarlaUE4/CarlaUE4.uproject
          make setup ARGS="--chrono"
        shell: cmd

      - name: build
        run: |
          call setEnv64.bat
          make plugins
        shell: cmd

      - name: retrieve content
        run: |
          call setEnv64.bat
          call Update.bat
        shell: cmd

      - name: package
        run: |
          call setEnv64.bat
          make package ARGS="--chrono"
        shell: cmd

      # cmd 只把最后一条命令的退出码作为该步骤的结果，
      # 所以每个 make check.* 失败时都要立即退出，否则前面测试的失败会被忽略。
      - name: test
        run: |
          call setEnv64.bat
          make check.PythonAPI || exit /b 1
          make check.smoke || exit /b 1
          make check.air || exit /b 1
          make check.vr || exit /b 1
          make check.python || exit /b 1
        shell: cmd


      - uses: mickem/clean-after-action@v1

      - name: Delete .git folder
        run: |
            del /f /s /q .git
            rd /s /q .git
        shell: cmd
