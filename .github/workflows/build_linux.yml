name: hubt Linux CI/CD

on:
   workflow_dispatch:

jobs:
    linux-dev:
             name: Linux CI/CD
             timeout-minutes: 1440
             runs-on: self-hosted:ubuntu-hutb

             env:
                UE4_ROOT: ~/UnrealEngine_4.26

             steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5
                    with:
                         fetch-depth: 0

                  - name: Show files
                    run: |
                       pwd
                       ls -al
                  
                  - name: setup
                    run: |
                       source ./setEnv64.sh 
                       git update-index --skip-worktree Unreal/CarlaUE4/CarlaUE4.uproject
                       make setup ARGS="--chrono"
                    shell: bash 
                 
                  - name: build 
                    run: |
                       source ./setEnv64.sh 
                       make plugins 
                    shell: bash  

                  - name: retrieve content
                    run: | 
                       source ./setEnv64.sh 
                       source ./Update.sh  
                    shell: bash 

                  - name: package 
                    run: |
                       source ./setEnv64.sh 
                       make package ARGS="--chrono"
                    shell: bash 



