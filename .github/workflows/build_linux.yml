name: hubt Linux CI/CD

on:
   push:
   pull_request:


jobs:
    linux-dev:
             name: Linux CI/CD
             timeout-minutes: 1440
             runs-on: self-hosted:ubuntu-hutb

             env:
                UE4_ROOT: /home/ubuntu/UnrealEngine_4.26

             steps:
                  - name: Checkout repository
                    uses: actions/checkout@v5
                    with:
                         fetch-depth: 0

                  - name: Show files
                    run: |
                       pwd
                       ls -al
                  
                  - name: setup
                    run: |
                       source ./setEnv64.sh 
                       git update-index --skip-worktree Unreal/CarlaUE4/CarlaUE4.uproject
                       make setup ARGS="--chrono"
                    shell: bash 
                 
                  - name: build 
                    run: |
                       source ./setEnv64.sh 
                       make plugins 
                    shell: bash  

                  - name: retrieve content
                    run: | 
                       source ./setEnv64.sh 
                       source ./Update.sh  
                    shell: bash 
                  
                  - name: CarlaUE4Editor
                    run: |
                       source ./setEnv64.sh 
                       make CarlaUE4Editor ARGS="--chrono -j$(nproc)"
                    shell: bash
                    
                    # - name: package 
                    #run: |
                    #   source ./setEnv64.sh 
                    #   make package ARGS="--chrono"
                    # shell: bash 



